<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <!--
      Content Security Policy — browser refuses to load resources / execute
      code from origins not listed here. Even if a dependency or user input
      somehow produced an inline <script>, it wouldn't run unless it matched.
      Hosts whitelisted for concrete uses:
        - fonts.googleapis.com / fonts.gstatic.com: Google Fonts (Oswald)
      'unsafe-inline' in script-src is needed because react-scripts 3.x
      inlines the webpack-runtime bootstrap in the built index.html. If you
      rebuild with INLINE_RUNTIME_CHUNK=false (.env), you can drop it.
      Note: frame-ancestors can't be set via <meta> — add it as an HTTP
      header on the webserver if you want clickjacking protection too.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none';"/>
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
     <meta name="description" content="Community-maintained MicroFreak preset reader with 512 preset support and enhanced features." />
<meta name="author" content="Colin Reed" />
<title>MicroFreak Reader Community Edition</title>
<meta property="og:title" content="MicroFreak Reader Community Edition">
<meta property="og:description" content="Community-maintained MicroFreak preset reader with 512 preset support and enhanced features.">
<meta property="og:url" content="https://github.com/colinmreed/community-microfreak-reader">
<meta property="og:type" content="website">
    <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,500&display=swap" rel="stylesheet">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
</body>
</html>
